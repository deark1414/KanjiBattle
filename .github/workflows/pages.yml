name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files only
        run: |
          mkdir -p "$RUNNER_TEMP/kanji-pages"
          cp -R Docs/game "$RUNNER_TEMP/kanji-pages/game"
          cp Docs/index.html Docs/.nojekyll "$RUNNER_TEMP/kanji-pages/"
          mkdir -p "$RUNNER_TEMP/kanji-pages/licenses"
          cp Licenses/NotoSansJP-OFL.txt "$RUNNER_TEMP/kanji-pages/licenses/"
          cp "Assets/TextMesh Pro/Fonts/LiberationSans - OFL.txt" "$RUNNER_TEMP/kanji-pages/licenses/LiberationSans-OFL.txt"
          cp Assets/Art/Generated/CharacterIcons/YujiBoku-OFL.txt "$RUNNER_TEMP/kanji-pages/licenses/"
          cp Assets/Resources/Kenney/UIRPG/KENNEY_UI_RPG_NOTICE.md "$RUNNER_TEMP/kanji-pages/licenses/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/kanji-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
