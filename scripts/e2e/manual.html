<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KanjiBattle 手動デバッグ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#151b17;color:#eef2ec;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #4b594e}
strong{font-size:14px}select,button{font:inherit;color:inherit;background:#303c33;border:1px solid #79877c;border-radius:4px;padding:6px 8px}
button:disabled,select:disabled{opacity:.45}output{font-size:12px;overflow-wrap:anywhere}iframe{flex:1;width:100%;min-height:0;border:0}
</style>
<header>
  <strong>KanjiBattle / DEBUG</strong>
  <select id="preset" aria-label="初期状態" disabled><option value="standard">融合確認・勝利</option><option value="defeat">融合確認・敗北</option><option value="locked">融合解放前</option><option value="support">新キャラ・鈴糸影</option><option value="defense">守り・甲盾壁弓</option><option value="animals">干支・丑の育成支援</option><option value="elements">電・風・鉄</option><option value="soldiers">戦士・衛兵</option><option value="forge">鍛冶・双剣</option></select>
  <button id="reset" title="デバッグ用の進行だけを選択した状態で初期化" disabled>初期化</button>
  <button id="formation" title="進行を保持して確認用の編成へ戻る" disabled>編成へ</button>
  <button id="defeat" title="確認用ステージの次の戦闘を敗北条件へ変更" disabled>次戦を強敵に</button>
  <output id="status" role="status">起動中</output>
</header>
<iframe id="game" title="KanjiBattle デバッグ専用版" src="/game/index.html"></iframe>
<script>
const frame = document.querySelector('#game');
const status = document.querySelector('#status');
const preset = document.querySelector('#preset');
const advanced = [['wave','波'],['magnet','磁石'],['mountain','山'],['coal','炭'],['fortress','要塞'],['dice','賽子'],['rain','雨'],['sand','砂'],['grass','草'],['cocoon','繭'],['windchime','風鈴'],['lantern','灯']];
for (const [key,label] of advanced) preset.add(new Option(label,'fusion-'+key));
const controls = [...document.querySelectorAll('button,select')];
const pending = new Map();
const chunks = new Map();
const key = 'kanji-manual-debug-preset';
let sequence = 0;
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== frame.contentWindow || event.data?.type !== 'kanji-debug-state') return;
  const match = event.data.value.match(/^KANJI_E2E_PART:([^:]+):(\d+):(\d+):([^\n]*)/);
  if (!match) return;
  const [, id, index, count, payload] = match;
  const parts = chunks.get(id) || new Map(); parts.set(+index, payload); chunks.set(id, parts);
  if (parts.size !== +count) return;
  try {
    const joined = Array.from({length:+count},(_,i)=>parts.get(i)).join('');
    const state = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(joined),char=>char.charCodeAt(0))));
    const request = pending.get(id); pending.delete(id); chunks.delete(id);
    if (request) { clearTimeout(request.timer); state.error ? request.reject(new Error(state.error)) : request.resolve(state); }
  } catch(error) { pending.get(id)?.reject(error); }
});
function command(action,value='') {
  return new Promise((resolve,reject)=>{
    const id = 'manual-' + (++sequence);
    const timer = setTimeout(()=>{pending.delete(id);reject(new Error('応答待ちがタイムアウトしました'));},15000);
    pending.set(id,{resolve,reject,timer});
    frame.contentWindow.focus();
    frame.contentWindow.unityInstance.SendMessage('BattleE2E','Command',JSON.stringify({id,action,value}));
  });
}
async function execute(action,value='') {
  controls.forEach(control=>control.disabled=true); status.textContent='準備中';
  try {
    const state = await command(action,value);
    if(action==='seed') localStorage.setItem(key,value);
    status.textContent=`準備完了 / 融合${state.fusionUnlocked?'解放済み':'未解放'} / 戦果 ${state.stagePoints}`;
    return state;
  } catch(error) { status.textContent=error.message; throw error; }
  finally { controls.forEach(control=>control.disabled=false); }
}
document.querySelector('#reset').onclick=()=>execute('seed',preset.value).catch(()=>{});
document.querySelector('#formation').onclick=()=>execute('resume').catch(()=>{});
document.querySelector('#defeat').onclick=()=>execute('nextDefeat').catch(()=>{});
(async()=>{
  const deadline=Date.now()+120000;
  while(!frame.contentWindow.unityInstance) {
    if(Date.now()>deadline) throw new Error('ゲームの起動に失敗しました');
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  await new Promise(resolve=>setTimeout(resolve,4500));
  const selected=new URLSearchParams(location.search).get('preset');
  const valid=['standard','defeat','locked','support','defense','animals','elements','soldiers','forge',...advanced.map(([key])=>'fusion-'+key)];
  const explicit=valid.includes(selected);
  preset.value=explicit?selected:(localStorage.getItem(key)||'standard');
  await execute(explicit || !localStorage.getItem(key)?'seed':'resume',preset.value);
})().catch(error=>status.textContent=error.message);
</script>
</html>
