<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f2;color:#26342b;font:15px system-ui,sans-serif;letter-spacing:0}header{background:white;border-bottom:1px solid #cbd3cc;padding:18px 24px}header>div,main{max-width:1100px;margin:auto}header>div{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}small{color:#667367;font-size:13px}.controls{display:flex;gap:12px;margin-left:auto;align-items:center}button{font:inherit;background:white;color:#263e30;border:1px solid #a9b8ac;cursor:pointer;min-width:40px;height:36px;border-radius:3px}button:hover{background:#e9f0eb}button[aria-pressed=true]{background:#315840;color:white}.angles{display:flex}.angles button{border-radius:0;border-right:0}.angles button:first-child{border-radius:3px 0 0 3px}.angles button:last-child{border-right:1px solid #a9b8ac;border-radius:0 3px 3px 0}main{padding:16px 24px}article{padding:10px 0 20px;border-bottom:1px solid #cbd3cc}h2{font-size:17px;margin:0 0 10px}h2 span{font-weight:400;font-size:14px;margin-left:14px;color:#667367}.row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:center}.still{height:190px;display:grid;place-items:center;background-color:#e2e7e3;background-image:linear-gradient(45deg,#d6ddd8 25%,transparent 25%),linear-gradient(-45deg,#d6ddd8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6ddd8 75%),linear-gradient(-45deg,transparent 75%,#d6ddd8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.still img{object-fit:contain;max-width:184px;max-height:170px;image-rendering:pixelated}.scene{display:block;width:100%;aspect-ratio:16/7;background:#74866b;image-rendering:pixelated}#error{color:#b02929}@media(max-width:650px){header{padding:14px 12px}.controls{margin-left:0;width:100%}main{padding:12px}.row{grid-template-columns:1fr;gap:10px}.still{height:106px}.still img{max-height:96px;max-width:210px}h1{font-size:19px}}
.still.pair{grid-template-columns:1fr 1fr;gap:6px;padding:8px}.still.pair img{max-width:100%;max-height:150px;width:auto}.still.pair img:first-child{width:95px}@media(max-width:650px){.still.pair img{max-height:90px}.still.pair img:first-child{width:160px}}
.still img[data-effect=BellNote]{max-height:90px;width:auto}@media(max-width:650px){.still img[data-effect=BellNote]{max-height:70px}}
</style>
<style>.still:has(img[data-effect=DiceFace1]){grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.still:has(img[data-effect=CoalCold]){grid-template-columns:repeat(3,minmax(0,1fr))}.still:has(img[data-effect=DiceFace1]) img,.still:has(img[data-effect=CoalCold]) img{width:100%;max-height:70px;min-width:0}@media(max-width:650px){.still:has(img[data-effect=DiceFace1]){height:150px}.still:has(img[data-effect=DiceFace1]) img{max-height:44px}}</style>
<header><div><h1>スキル画像</h1><small>動作見本・ゲーム接続済み</small><div class="controls"><button id="play" title="一時停止" aria-label="一時停止">&#10074;&#10074;</button><button id="replay" title="最初から再生" aria-label="最初から再生">&#8634;</button><div class="angles" role="group" aria-label="向き"><button data-angle="0" aria-pressed="true">0°</button><button data-angle="90" aria-pressed="false">90°</button><button data-angle="180" aria-pressed="false">180°</button><button data-angle="270" aria-pressed="false">270°</button></div></div></div></header>
<style>article[data-key=IronAdapt] .still,article[data-key=Sentinel] .still{grid-template-columns:repeat(3,minmax(0,1fr))}article[data-key=IronAdapt] .still img,article[data-key=Sentinel] .still img{width:100%;max-height:90px;min-width:0}</style>
<main><article data-key="ChainLightning"><h2>電<span>連鎖電撃</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="電の動作草案"></canvas></div></article><article data-key="PullThread"><h2>糸<span>引き糸</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="糸の動作草案"></canvas></div></article><article data-key="BellEcho"><h2>鈴<span>再響</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="鈴の動作草案"></canvas></div></article><article data-key="CocoonGuard"><h2>繭<span id="cocoon-phase">待機</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="繭の巻き付きから保護への動作草案"></canvas></div></article><p id="error" role="alert"></p></main>
<script>
const draft='/Assets/Art/Drafts/VFX/SupportSkills/';
const art='/Assets/Resources/UI/CharacterPieces/';
const additions=[['WindGust','風','追風・向風'],['MagneticPull','磁石','引き寄せ'],['RainRipple','雨','継続回復'],['ForgeSparks','鍛冶','武器強化'],['MortarImpact','要塞','迫撃砲'],['SandBloom','砂','砂の分身']];
additions.push(['WaveCrest','波','押し流し'],['GrassSprout','草','分裂'],['CoalEmbers','炭','被弾後の強化'],['LanternFlame','灯','遠距離回避'],['ShadowMist','影','変身'],['DiceSparkles','賽子','出目確定']);
additions.push(['GuardAlly','甲','肩代わり'],['ExperienceBonus','丑','勝利・経験値（表示例）'],['IronAdapt','鉄','形態切替'],['DoubleSlash','双剣','連続範囲攻撃'],['ScatterShot','散弾','扇状射撃'],['Warrior','戦士','斬撃・防御・鼓舞'],['Sentinel','衛兵','刺突・防御・守護回復'],['Mountain','山','ダメージ返還'],['WindChime','風鈴','全体再響']);
const remainingAssets={GuardAlly:['GuardShell'],ExperienceBonus:['BonusOx','DiceSparkles'],IronAdapt:['ReviewSword','ReviewSpear','GuardShield'],DoubleSlash:['ReviewSword'],ScatterShot:['MortarShell'],Warrior:['ReviewSword','GuardShield'],Sentinel:['ReviewSpear','GuardShield','RainDrops'],Mountain:['MountainRebound'],WindChime:['BellEcho','BellNote']};
for(const [key,name,skill]of additions){const article=document.createElement('article');article.dataset.key=key;article.innerHTML=`<h2>${name}<span>${skill}</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="${name}の動作草案"></canvas></div>`;document.querySelector('#error').before(article);}
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('画像を読み込めません: '+src));i.src=src;});
const skillSelect=document.createElement('select');skillSelect.ariaLabel='スキル選択';skillSelect.style.cssText='font:inherit;max-width:160px;height:36px;color:#263e30;background:white;border:1px solid #a9b8ac;border-radius:3px';skillSelect.add(new Option('スキルを選択',''));for(const a of document.querySelectorAll('article')){a.id='skill-'+a.dataset.key;skillSelect.add(new Option(a.querySelector('h2').firstChild.textContent,a.id));}skillSelect.onchange=()=>{if(skillSelect.value)document.getElementById(skillSelect.value).scrollIntoView({block:'start'});};document.querySelector('.controls').prepend(skillSelect);
document.querySelector('.controls').style.flexWrap='wrap';
let playing=true,elapsed=0,last=performance.now(),angle=0,layouts,images,pieces;
let bellSeed=Math.floor(Math.random()*4294967296),bellReplay=0;
const play=document.querySelector('#play');
function setPlaying(value){playing=value;play.innerHTML=value?'&#10074;&#10074;':'&#9654;';play.title=play.ariaLabel=value?'一時停止':'再生';}
play.onclick=()=>setPlaying(!playing);document.querySelector('#replay').onclick=()=>{elapsed=0;bellReplay++;setPlaying(true);};
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);document.querySelectorAll('[data-angle]').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));draw();});
function point(x,y){const r=angle*Math.PI/180,s=angle%180?0.45:1;return{x:320+((x-320)*Math.cos(r)-(y-140)*Math.sin(r))*s,y:140+((x-320)*Math.sin(r)+(y-140)*Math.cos(r))*s};}
function piece(ctx,image,p,bump=0){ctx.drawImage(image,p.x-27,p.y-32-bump,54,64);}
function link(ctx,key,a,b,alpha=1){const l=layouts[key],r=l.bounds,dist=Math.hypot(b.x-a.x,b.y-a.y);ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x));const h=key==='PullThread'?Math.max(3,dist*r.h/r.w):Math.max(7,dist*r.h/r.w);ctx.drawImage(images[key],r.x,r.y,r.w,r.h,0,-h/2,dist,h);ctx.restore();}
// Each burst has a fixed cosmetic seed; drawing another frame never rerolls it.
function bellNotes(progress,cycle,lane){
 let state=(bellSeed^Math.imul(cycle+1,0x9e3779b1)^Math.imul(lane+1,0x85ebca6b)^Math.imul(bellReplay+1,0xc2b2ae35))>>>0;
 const random=()=>{state=(state+0x6d2b79f5)>>>0;let n=state;n=Math.imul(n^(n>>>15),n|1);n^=n+Math.imul(n^(n>>>7),n|61);return((n^(n>>>14))>>>0)/4294967296;};
 const count=2+Math.floor(random()*2),base=random()*Math.PI*2,result=[],bounds=layouts.BellNote.bounds;
 for(let i=0;i<count;i++){const direction=base+i*Math.PI*2/count+(random()-.5)*.45,radius=60+random()*4,travel=6+random()*4,height=14+random()*4,tilt=(random()-.5)*.7,spin=(random()-.5)*.3,delay=random()*.1,q=Math.max(0,Math.min(1,(progress-delay)/(1-delay))),distance=radius+q*travel;
 result.push({x:Math.cos(direction)*distance,y:Math.sin(direction)*distance,width:height*bounds.w/bounds.h,height,rotation:tilt+spin*q,alpha:progress>=delay&&progress<1?Math.sin(q*Math.PI):0});}
 return result;
}
function ring(ctx,p,progress,cycle,lane){const r=layouts.BellEcho.bounds;ctx.save();ctx.globalAlpha=Math.sin(progress*Math.PI);const size=70+progress*85;ctx.drawImage(images.BellEcho,r.x,r.y,r.w,r.h,p.x-size/2,p.y-size/2,size,size);ctx.restore();
 const note=layouts.BellNote.bounds;for(const n of bellNotes(progress,cycle,lane)){ctx.save();ctx.globalAlpha=n.alpha;ctx.translate(p.x+n.x,p.y+n.y);ctx.rotate(n.rotation);ctx.drawImage(images.BellNote,note.x,note.y,note.w,note.h,-n.width/2,-n.height/2,n.width,n.height);ctx.restore();}}
function overlay(ctx,key,p,alpha=1,height=104){const r=layouts[key].bounds,w=height*r.w/r.h;ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(images[key],r.x,r.y,r.w,r.h,p.x-w/2,p.y-height/2,w,height);ctx.restore();}
function cocoonState(seconds){const t=seconds%4.2,wrap=t>=.25&&t<1.2?Math.min(1,(t-.25)/.18,(1.2-t)/.2):0,guard=t>=1.28&&t<3.6?Math.min(1,(t-1.28)/.22,(3.6-t)/.3):0;return{wrap,guard,phase:wrap>0?'巻き付き':guard>0?'保護':'待機'};}
const clamp=x=>Math.max(0,Math.min(1,x));
function forgeState(t){return{hammer:t>=.18&&t<.9,heat:t<.7?0:clamp(Math.min((t-.7)/.16,(2.4-t)/.7)),impact:windowAlpha(t,.69,1.05)};}
function magnetState(t){return{pull:clamp((t-.75)/.8),waves:t>=.25&&t<1.7};}
function magnetWaves(a,b,t){
 const theta=Math.atan2(b.y-a.y,b.x-a.x),rotation=theta-Math.atan2(-1,.25),result=[];
 if(!magnetState(t).waves)return result;
 // Pole centers are measured in the cropped, upright magnet image.
 for(const [pole,tip]of [[0,{x:-12.8,y:-29.24}],[1,{x:16,y:-15.48}]])for(let i=0;i<3;i++){
  const q=(t-.25-i*.16)/.8;if(q<0||q>1)continue;
  const distance=8+q*42;
  result.push({pole,x:a.x+tip.x*Math.cos(rotation)-tip.y*Math.sin(rotation)+Math.cos(theta)*distance,y:a.y+tip.x*Math.sin(rotation)+tip.y*Math.cos(rotation)+Math.sin(theta)*distance,height:13+q*10,alpha:Math.sin(q*Math.PI)*.95,rotation:theta});
 }
 return result;
}
function magnetEffect(ctx,a,b,t){
 const theta=Math.atan2(b.y-a.y,b.x-a.x),r=layouts.MagnetBody.bounds;
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(theta-Math.atan2(-1,.25));ctx.drawImage(images.MagnetBody,r.x,r.y,r.w,r.h,-40,-43,80,86);ctx.restore();
 for(const wave of magnetWaves(a,b,t)){ctx.save();ctx.translate(wave.x,wave.y);ctx.rotate(wave.rotation);overlay(ctx,'MagneticPull',{x:0,y:0},wave.alpha,wave.height);ctx.restore();}
}
let hotPiece;
function forgeEffect(ctx,b,t){const state=forgeState(t);if(state.heat){ctx.save();ctx.globalAlpha=state.heat*.65;ctx.drawImage(hotPiece,b.x-27,b.y-32,54,64);ctx.restore();}if(state.hammer){const q=clamp((t-.18)/.52),rotation=-.8+q*q*2.33,r=layouts.ForgeHammer.bounds;ctx.save();ctx.globalAlpha=clamp((.9-t)/.1);ctx.translate(b.x-48,b.y-48);ctx.rotate(rotation);ctx.drawImage(images.ForgeHammer,r.x,r.y,r.w,r.h,-7.2,-64.8,72,72);ctx.restore();}if(state.impact)overlay(ctx,'ForgeSparks',{x:b.x,y:b.y-2},state.impact,58);}
function windowAlpha(t,start,end){return clamp(Math.min((t-start)/.12,(end-t)/.2));}
function extraScene(ctx,key,t){
 const a=point(150,140),b=point(440,140);
 if(key==='WindGust'){const q=clamp((t-.3)/.85),c=point(290+64*q,140);piece(ctx,pieces.wind,a);piece(ctx,pieces.friend,c);piece(ctx,pieces.enemy,point(510,140));if(t>.3&&t<1.7)link(ctx,key,point(205+64*q,140),point(405+64*q,140),windowAlpha(t,.3,1.7)*.85);}
 if(key==='MagneticPull'){const c=point(500-64*magnetState(t).pull,140);ctx.save();ctx.globalAlpha=.25;piece(ctx,pieces.magnet,a);ctx.restore();piece(ctx,pieces.enemy,c);magnetEffect(ctx,a,c,t);}
 if(key==='RainRipple'){const targets=[point(350,115),point(445,165)];for(const [i,p]of targets.entries()){const q=(t+i*.3)%1;overlay(ctx,key,{x:p.x,y:p.y+27},Math.sin(q*Math.PI)*.7,20+q*4);}piece(ctx,pieces.rain,a);targets.forEach(p=>piece(ctx,pieces.friend,p));for(const [i,p]of targets.entries())for(let j=0;j<3;j++){const q=(t*1.4+j/3+i*.18)%1;overlay(ctx,'RainDrops',{x:p.x+(j-1)*20,y:p.y-68+q*86},Math.sin(q*Math.PI)*.85,28);}}
 if(key==='ForgeSparks'){piece(ctx,pieces.forge,a);piece(ctx,pieces.friend,b);forgeEffect(ctx,b,t);}
 if(key==='MortarImpact'){piece(ctx,pieces.fortress,a);piece(ctx,pieces.enemy,b,t>1&&t<1.3?3:0);const q=clamp((t-.2)/.8);if(t>.2&&t<1){const p={x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q-Math.sin(q*Math.PI)*65},d={x:(b.x-a.x)*.025,y:(b.y-a.y-Math.cos(q*Math.PI)*65*Math.PI)*.025};link(ctx,'MortarShell',{x:p.x-d.x*3,y:p.y-d.y*3},p);}if(t>=1&&t<1.7)overlay(ctx,key,{x:b.x,y:b.y+18},windowAlpha(t,.98,1.7),100+(t-1)*25);}
 if(key==='SandBloom'){piece(ctx,pieces.sand,a);if(t>.65){ctx.save();ctx.globalAlpha=clamp((t-.65)/.35);piece(ctx,pieces.copy,b);ctx.restore();}if(t>.25&&t<1.35)overlay(ctx,key,{x:b.x,y:b.y+18},windowAlpha(t,.25,1.35),120);}
 batchThreeScene(ctx,key,t);
 remainingScene(ctx,key,t);
}
function ironState(seconds){const phase=seconds%2.8;return phase<.85?'剣':phase<1.7?'槍':'盾';}
function guardState(seconds){const t=seconds%2.8;return{impact:t>=.55&&t<.9,transfer:t>=.72&&t<1.4};}
function mountainState(seconds){const t=seconds%2.8;return{incoming:t>=.2&&t<.65,returning:t>=.8&&t<1.4};}
function swordStroke(ctx,a,b,q,reverse=false){
 const r=layouts.ReviewSword.bounds,w=115,h=w*r.h/r.w,sourceAngle=Math.atan2(-h*.9,w*.94),sweep=(reverse?1:-1)*(.7-1.4*q*q*q);
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x)-sourceAngle+sweep);ctx.globalAlpha=q<.95?1:(1-q)/.05;ctx.drawImage(images.ReviewSword,r.x,r.y,r.w,r.h,-w*.03,-h*.95,w,h);ctx.restore();
}
function shield(ctx,p,t,start=.3,end=1.6){const alpha=windowAlpha(t,start,end);if(alpha)overlay(ctx,'GuardShield',{x:p.x+16,y:p.y+3},alpha*.9,72);}
function floatNumber(ctx,p,value,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(value,p.x,p.y-38);ctx.restore();}
function remainingScene(ctx,key,t){
 const a=point(210,140),b=point(420,140);
 if(key==='GuardAlly'){const guard=point(290,140),friend=point(350,140),s=guardState(elapsed);piece(ctx,pieces.guard,guard,s.transfer?3:0);piece(ctx,pieces.friend,friend,s.impact?3:0);piece(ctx,pieces.enemy,point(520,140));const cover=windowAlpha(t,.4,1.5);if(cover)overlay(ctx,'GuardShell',{x:friend.x+9,y:friend.y+18},cover*.9,56);if(t>.2&&t<.55){const x=520-155*(t-.2)/.35;link(ctx,'MortarShell',point(x+12,140),point(x,140));}if(s.impact)floatNumber(ctx,friend,'−20','#ffe2c7');if(s.transfer){overlay(ctx,'GuardShell',{x:guard.x,y:guard.y+18},windowAlpha(t,.7,1.4)*.8,48);floatNumber(ctx,guard,'−10','#ffd7b5');overlay(ctx,'ForgeSparks',guard,windowAlpha(t,.7,1.4)*.6,40);}}
 if(key==='ExperienceBonus'){overlay(ctx,'BonusOx',point(185,150),1,94);const p=point(410,140),q=clamp((t-.25)/.85);ctx.save();ctx.textAlign='center';ctx.fillStyle='#f7f6e9';ctx.font='16px system-ui';ctx.fillText('獲得経験値',p.x,p.y-32);ctx.font='bold 38px system-ui';ctx.fillText(String(Math.round(150*q)),p.x,p.y+10);ctx.fillStyle='#fbe6a7';ctx.font='16px system-ui';ctx.fillText('丑 ×1.5',p.x,p.y+40);ctx.restore();if(t>.85&&t<1.8)overlay(ctx,'DiceSparkles',p,windowAlpha(t,.85,1.8),116);}
 if(key==='IronAdapt'){const form=ironState(elapsed);piece(ctx,pieces.iron,a);piece(ctx,pieces.enemy,b);if(form==='剣')swordStroke(ctx,a,point(330,140),clamp(t/.85));else if(form==='槍')link(ctx,'ReviewSpear',a,point(320+Math.sin((t-.85)/.85*Math.PI)*65,140));else shield(ctx,a,t,1.7,2.8);document.querySelector('article[data-key=IronAdapt] h2 span').textContent=form+'の形態';}
 if(key==='DoubleSlash'){piece(ctx,pieces.double,a);for(const y of [90,140,190])piece(ctx,pieces.enemy,point(330,y));for(let i=0;i<2;i++){const q=(t-.25-i*.5)/.4;if(q>=0&&q<1)swordStroke(ctx,a,point(330,140),q,!!i);}}
 if(key==='ScatterShot'){piece(ctx,pieces.scatter,a);for(const y of [85,140,195])piece(ctx,pieces.enemy,point(455,y));const q=(t-.3)/.65;if(q>=0&&q<1)for(const y of [85,140,195]){const p=point(210+245*q,140+(y-140)*q),tail=point(210+245*q-18,140+(y-140)*q-(y-140)*.07);link(ctx,'MortarShell',tail,p);}if(t>.95&&t<1.2)for(const y of [85,140,195])overlay(ctx,'ForgeSparks',point(455,y),windowAlpha(t,.94,1.2),32);}
 if(key==='Warrior'){piece(ctx,pieces.warrior,a);piece(ctx,pieces.friend,b);if(t>.2&&t<.65)swordStroke(ctx,a,point(330,140),(t-.2)/.45);shield(ctx,a,t,.2,.8);if(t>.8&&t<1.8)for(const p of [a,b]){ctx.save();ctx.filter='hue-rotate(320deg)';overlay(ctx,'BellEcho',p,windowAlpha(t,.8,1.8),86);ctx.restore();floatNumber(ctx,p,'攻撃↑','#ffe0ad',windowAlpha(t,.8,1.8));}}
 if(key==='Sentinel'){piece(ctx,pieces.sentinel,a);piece(ctx,pieces.friend,point(300,140));shield(ctx,a,t,.2,.8);if(t>.2&&t<.65)link(ctx,'ReviewSpear',a,point(320+30*Math.sin((t-.2)/.45*Math.PI),140));if(t>.8&&t<2.1)for(const [i,p]of [a,point(300,140)].entries()){overlay(ctx,'RainDrops',{x:p.x,y:p.y-20-8*Math.sin(t*8+i)},windowAlpha(t,.8,2.1),36);floatNumber(ctx,p,'+4%','#d6f7df',windowAlpha(t,.8,2.1));}}
 if(key==='Mountain'){const s=mountainState(elapsed);piece(ctx,pieces.mountain,a,t>.65&&t<.8?3:0);piece(ctx,pieces.enemy,b,s.returning?3:0);if(s.incoming){const x=420-195*(t-.2)/.45;link(ctx,'MortarShell',point(x+15,140),point(x,140));}if(t>.6&&t<1.05)overlay(ctx,'MountainRebound',a,windowAlpha(t,.6,1.05),105);if(s.returning){const x=230+175*(t-.8)/.6;link(ctx,'MortarShell',point(x-15,140),point(x,140));}}
 if(key==='WindChime'){const positions=[point(160,140),point(320,140),point(480,140)];piece(ctx,pieces.chime,positions[0]);positions.slice(1).forEach(p=>piece(ctx,pieces.friend,p));for(let i=0;i<3;i++){const q=(t-.25-i*.18)/.9;if(q>0&&q<1){ctx.save();ctx.translate(positions[i].x,positions[i].y);ctx.scale(.72,.72);ring(ctx,{x:0,y:0},q,Math.floor(elapsed/2.8),i+2);ctx.restore();}}}
}
let diceSeed=Math.floor(Math.random()*4294967296);
function diceRandom(cycle,index){let n=(diceSeed^Math.imul(cycle+1,0x9e3779b1)^Math.imul(index+1,0x85ebca6b)^Math.imul(bellReplay+1,0xc2b2ae35))>>>0;n=Math.imul(n^(n>>>16),0x21f0aaad);n=Math.imul(n^(n>>>15),0x735a2d97);return((n^(n>>>15))>>>0)/4294967296;}
function diceState(seconds){const cycle=Math.floor(seconds/2.8),t=seconds%2.8,stops=[0,.07,.15,.25,.38,.54,.73],settled=t>=.98,index=settled?7:stops.findLastIndex(s=>t>=s),faces=[1+Math.floor(diceRandom(cycle,0)*6)];for(let i=1;i<=7;i++)faces.push(1+(faces[i-1]+Math.floor(diceRandom(cycle,i)*5))%6);const face=faces[index];return{face,imageKey:'DiceFace'+face,effect:face<=2?'回復':face<=4?'防御強化':'攻撃強化',settled,index};}
function coalState(seconds){return{key:seconds%2.8<.5?'CoalCold':'CoalHot',embers:windowAlpha(seconds%2.8,.5,.95)};}
function batchThreeScene(ctx,key,t){
 const a=point(180,140),b=point(420,140);
 if(key==='WaveCrest'){const q=clamp((t-.25)/.9),push=clamp((t-.65)/.5);piece(ctx,pieces.wave,a);piece(ctx,pieces.enemy,point(420+64*push,140));if(t>.25&&t<1.5)link(ctx,key,point(210+210*q,150),point(345+210*q,150),windowAlpha(t,.25,1.5));}

}
function draw(){if(!images)return;const t=elapsed%2.8;
 for(const article of document.querySelectorAll('article')){const key=article.dataset.key,c=article.querySelector('canvas'),ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#74866b';ctx.fillRect(0,0,640,280);ctx.strokeStyle='#94a184';ctx.lineWidth=1;for(let x=0;x<640;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,280);ctx.stroke();}for(let y=12;y<280;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();}

  if(key==='CocoonGuard'){const a=point(230,140),b=point(410,140),state=cocoonState(elapsed);piece(ctx,pieces.cocoon,a);piece(ctx,pieces.friend,b);if(state.wrap>0)overlay(ctx,'ThreadWrap',b,state.wrap,112);if(state.guard>0)overlay(ctx,'CocoonGuard',b,state.guard,126);document.querySelector('#cocoon-phase').textContent=state.phase;}
  if(key==='BellEcho'){const a=point(230,140),b=point(410,140);piece(ctx,pieces.bell,a);piece(ctx,pieces.friend,b,t>0.75&&t<1.05?4:0);if(t>0.25&&t<1.15)ring(ctx,a,(t-0.25)/0.9,Math.floor(elapsed/2.8),0);if(t>0.55&&t<1.45)ring(ctx,b,(t-0.55)/0.9,Math.floor(elapsed/2.8),1);}
  extraScene(ctx,key,t);
 }
}
async function init(){const r=await fetch(draft+'layout.json');if(!r.ok)throw Error('画像配置を読み込めません');layouts=Object.fromEntries((await r.json()).entries.map(e=>[e.key,e]));images=Object.fromEntries(await Promise.all(Object.keys(layouts).map(async k=>[k,await load(draft+k+'.png')])));pieces=Object.fromEntries(await Promise.all(Object.entries({electric:'Piece_31.png',thread:'Piece_28.png',bell:'Piece_27.png',enemy:'Piece_10_Enemy.png',friend:'Piece_10.png',cocoon:'Piece_F1015.png',wind:'Piece_32.png',magnet:'Piece_F1007.png',rain:'Piece_F1012.png',forge:'Piece_F1005.png',fortress:'Piece_F1010.png',sand:'Piece_F1013.png',copy:'Piece_F20000.png',wave:'Piece_F1006.png',grass:'Piece_F1014.png',coal:'Piece_F1009.png',lantern:'Piece_F1017.png',shadow:'Piece_29.png',guard:'Piece_14.png',iron:'Piece_33.png',double:'Piece_F1001.png',scatter:'Piece_F1002.png',warrior:'Piece_F1003.png',sentinel:'Piece_F1004.png',mountain:'Piece_F1008.png',chime:'Piece_F1016.png'}).map(async([k,n])=>[k,await load(art+n)])));hotPiece=document.createElement('canvas');hotPiece.width=pieces.friend.width;hotPiece.height=pieces.friend.height;const heat=hotPiece.getContext('2d');heat.drawImage(pieces.friend,0,0);heat.globalCompositeOperation='source-atop';heat.fillStyle='#ee482b';heat.fillRect(0,0,hotPiece.width,hotPiece.height);for(const a of document.querySelectorAll('article')){const keys=remainingAssets[a.dataset.key]||(a.dataset.key==='CoalEmbers'?['CoalCold','CoalHot','CoalEmbers']:a.dataset.key==='DiceSparkles'?['DiceFace1','DiceFace2','DiceFace3','DiceFace4','DiceFace5','DiceFace6','DiceSparkles']:a.dataset.key==='MagneticPull'?['MagnetBody','MagneticPull']:a.dataset.key==='ForgeSparks'?['ForgeHammer','ForgeSparks']:a.dataset.key==='RainRipple'?['RainRipple','RainDrops']:a.dataset.key==='MortarImpact'?['MortarShell','MortarImpact']:a.dataset.key==='PullThread'?['PullThread','ThreadWrap']:a.dataset.key==='BellEcho'?['BellEcho','BellNote']:[a.dataset.key]);if(keys.length>1)a.querySelector('.still')
