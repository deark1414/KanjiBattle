<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スキル画像草案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f2;color:#26342b;font:15px system-ui,sans-serif;letter-spacing:0}header{background:white;border-bottom:1px solid #cbd3cc;padding:18px 24px}header>div,main{max-width:1100px;margin:auto}header>div{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}small{color:#667367;font-size:13px}.controls{display:flex;gap:12px;margin-left:auto;align-items:center}button{font:inherit;background:white;color:#263e30;border:1px solid #a9b8ac;cursor:pointer;min-width:40px;height:36px;border-radius:3px}button:hover{background:#e9f0eb}button[aria-pressed=true]{background:#315840;color:white}.angles{display:flex}.angles button{border-radius:0;border-right:0}.angles button:first-child{border-radius:3px 0 0 3px}.angles button:last-child{border-right:1px solid #a9b8ac;border-radius:0 3px 3px 0}main{padding:16px 24px}article{padding:10px 0 20px;border-bottom:1px solid #cbd3cc}h2{font-size:17px;margin:0 0 10px}h2 span{font-weight:400;font-size:14px;margin-left:14px;color:#667367}.row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:center}.still{height:190px;display:grid;place-items:center;background-color:#e2e7e3;background-image:linear-gradient(45deg,#d6ddd8 25%,transparent 25%),linear-gradient(-45deg,#d6ddd8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6ddd8 75%),linear-gradient(-45deg,transparent 75%,#d6ddd8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.still img{max-width:184px;max-height:170px;image-rendering:pixelated}.scene{display:block;width:100%;aspect-ratio:16/7;background:#74866b;image-rendering:pixelated}#error{color:#b02929}@media(max-width:650px){header{padding:14px 12px}.controls{margin-left:0;width:100%}main{padding:12px}.row{grid-template-columns:1fr;gap:10px}.still{height:106px}.still img{max-height:96px;max-width:210px}h1{font-size:19px}}
</style>
<header><div><h1>スキル画像</h1><small>草案・ゲーム未接続</small><div class="controls"><button id="play" title="一時停止" aria-label="一時停止">&#10074;&#10074;</button><button id="replay" title="最初から再生" aria-label="最初から再生">&#8634;</button><div class="angles" role="group" aria-label="向き"><button data-angle="0" aria-pressed="true">0°</button><button data-angle="90" aria-pressed="false">90°</button><button data-angle="180" aria-pressed="false">180°</button><button data-angle="270" aria-pressed="false">270°</button></div></div></div></header>
<main><article data-key="ChainLightning"><h2>電<span>連鎖電撃</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="電の動作草案"></canvas></div></article><article data-key="PullThread"><h2>糸<span>引き糸</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="糸の動作草案"></canvas></div></article><article data-key="BellEcho"><h2>鈴<span>再響</span></h2><div class="row"><div class="still"></div><canvas class="scene" width="1280" height="560" aria-label="鈴の動作草案"></canvas></div></article><p id="error" role="alert"></p></main>
<script>
const draft='/Assets/Art/Drafts/VFX/SupportSkills/';
const art='/Assets/Resources/UI/CharacterPieces/';
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('画像を読み込めません: '+src));i.src=src;});
let playing=true,elapsed=0,last=performance.now(),angle=0,layouts,images,pieces;
const play=document.querySelector('#play');
function setPlaying(value){playing=value;play.innerHTML=value?'&#10074;&#10074;':'&#9654;';play.title=play.ariaLabel=value?'一時停止':'再生';}
play.onclick=()=>setPlaying(!playing);document.querySelector('#replay').onclick=()=>{elapsed=0;setPlaying(true);};
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);document.querySelectorAll('[data-angle]').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));draw();});
function point(x,y){const r=angle*Math.PI/180,s=angle%180?0.45:1;return{x:320+((x-320)*Math.cos(r)-(y-140)*Math.sin(r))*s,y:140+((x-320)*Math.sin(r)+(y-140)*Math.cos(r))*s};}
function piece(ctx,image,p,bump=0){ctx.drawImage(image,p.x-27,p.y-32-bump,54,64);}
function link(ctx,key,a,b,alpha=1){const l=layouts[key],r=l.bounds,dist=Math.hypot(b.x-a.x,b.y-a.y);ctx.save();ctx.globalAlpha=alpha;ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(b.y-a.y,b.x-a.x));const h=key==='PullThread'?Math.max(3,dist*r.h/r.w):Math.max(7,dist*r.h/r.w);ctx.drawImage(images[key],r.x,r.y,r.w,r.h,0,-h/2,dist,h);ctx.restore();}
function ring(ctx,p,progress){const r=layouts.BellEcho.bounds;ctx.save();ctx.globalAlpha=Math.sin(progress*Math.PI);const size=70+progress*85;ctx.drawImage(images.BellEcho,r.x,r.y,r.w,r.h,p.x-size/2,p.y-size/2,size,size);ctx.restore();}
function draw(){if(!images)return;const t=elapsed%2.8;
 for(const article of document.querySelectorAll('article')){const key=article.dataset.key,c=article.querySelector('canvas'),ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#74866b';ctx.fillRect(0,0,640,280);ctx.strokeStyle='#94a184';ctx.lineWidth=1;for(let x=0;x<640;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,280);ctx.stroke();}for(let y=12;y<280;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();}
  if(key==='ChainLightning'){const positions=[point(100,140),point(290,140),point(420,140),point(540,140)];piece(ctx,pieces.electric,positions[0]);for(let i=1;i<4;i++)piece(ctx,pieces.enemy,positions[i],t>0.35+(i-1)*0.35&&t<0.62+(i-1)*0.35?3:0);for(let i=0;i<3;i++){const phase=t-0.35-i*0.35;if(phase>=0&&phase<0.34)link(ctx,key,positions[i],positions[i+1],Math.min(1,phase/0.04,(0.34-phase)/0.07));}}
  if(key==='PullThread'){const progress=Math.max(0,Math.min(1,(t-0.55)/0.7)),ease=progress*progress*(3-2*progress);const a=point(140,140),b=point(500-160*ease,140);piece(ctx,pieces.thread,a);piece(ctx,pieces.enemy,b);if(t>0.3&&t<1.5)link(ctx,key,a,b,Math.min(1,(t-0.3)/0.1,(1.5-t)/0.15));}
  if(key==='BellEcho'){const a=point(230,140),b=point(410,140);piece(ctx,pieces.bell,a);piece(ctx,pieces.friend,b,t>0.75&&t<1.05?4:0);if(t>0.25&&t<1.15)ring(ctx,a,(t-0.25)/0.9);if(t>0.55&&t<1.45)ring(ctx,b,(t-0.55)/0.9);}
 }
}
async function init(){const r=await fetch(draft+'layout.json');if(!r.ok)throw Error('画像配置を読み込めません');layouts=Object.fromEntries((await r.json()).entries.map(e=>[e.key,e]));images=Object.fromEntries(await Promise.all(Object.keys(layouts).map(async k=>[k,await load(draft+k+'.png')])));pieces=Object.fromEntries(await Promise.all(Object.entries({electric:'Piece_31.png',thread:'Piece_28.png',bell:'Piece_27.png',enemy:'Piece_10_Enemy.png',friend:'Piece_10.png'}).map(async([k,n])=>[k,await load(art+n)])));for(const a of document.querySelectorAll('article')){const i=new Image();i.src=images[a.dataset.key].src;i.alt=a.querySelector('h2').textContent+'の単画像';a.querySelector('.still').append(i);}window.supportVfxPreview={ready:true,renderAt(seconds,degrees=0){setPlaying(false);elapsed=seconds;angle=degrees;draw();},setPlaying};draw();requestAnimationFrame(tick);}
function tick(now){if(playing)elapsed+=(now-last)/1000;last=now;draw();requestAnimationFrame(tick);}
init().catch(e=>{document.querySelector('#error').textContent=e.message;console.error(e);});
</script>
</html>
